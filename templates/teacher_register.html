{% extends "base.html" %} {% block content %}

<div class="container-content py-4">
	<div class="row justify-content-center">
		<div class="col-md-6">
			<div class="card shadow-sm">
				<div class="card-header bg-white text-center">
					<h2 class="m-0">Teacher Register</h2>
				</div>
				<div class="card-body">
					<form action="{% url 'teacher_register' %}" method="POST" novalidate>
						{% csrf_token %}
						<div class="mb-3">
							<label for="id_username" class="form-label">Username</label>
							<input
								type="text"
								name="username"
								id="id_username"
								class="form-control"
								required
							/>
						</div>

						<div class="mb-3">
							<label for="id_first_name" class="form-label">First name</label>
							<input
								type="text"
								name="first_name"
								id="id_first_name"
								class="form-control"
								required
							/>
						</div>

						<div class="mb-3">
							<label for="id_last_name" class="form-label">Last name</label>
							<input
								type="text"
								name="last_name"
								id="id_last_name"
								class="form-control"
								required
							/>
						</div>

						<div class="mb-3">
							<label for="id_password1" class="form-label">Password</label>
							<input
								type="password"
								name="password1"
								id="id_password1"
								class="form-control"
								required
							/>
						</div>

						<div class="mb-3">
							<label for="id_password2" class="form-label"
								>Password confirmation</label
							>
							<input
								type="password"
								name="password2"
								id="id_password2"
								class="form-control"
								required
							/>
						</div>

						{% if form.errors %}
						<div class="text-danger small mb-2">
							{% for field in form %} {% for error in field.errors %} {{ error
							}}<br />
							{% endfor %} {% endfor %} {% for error in form.non_field_errors %}
							{{ error }}<br />
							{% endfor %}
						</div>
						{% endif %}

						<button type="submit" class="btn btn-primary w-100">
							Register
						</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
