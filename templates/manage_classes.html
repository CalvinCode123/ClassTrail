{% extends "base.html" %} {% load crispy_forms_tags %} {% block extra_css %}
<style>
	.jumbotron {
		height: 10vw;
	}

	table,
	td {
		border: 1px solid black;
	}

	footer {
		background-color: #f2f2f2;
		padding: 25px;
	}

	.row [class*="col-"] {
		margin-bottom: -99999px;
		padding-bottom: 99999px;
	}

	.row {
		overflow: hidden;
	}

	img {
		width: 200px;
		height: 200px;
		object-fit: cover;
		margin: auto;
	}

	.hoverTable {
		width: 100%;
		border-collapse: collapse;
		margin-bottom: 5vw;
	}
	.hoverTable td,
	.hoverTable th {
		padding: 7px;
		border: black 1px solid;
	}
	.hoverTable tr {
		background: #eee;
	}
	.hoverTable tr:hover {
		background-color: #b8d1f3;
	}
</style>
{% endblock %} {% block content %}

<div class="jumbotron">
	<div class="container text-center">
		<h1>Manage Classes</h1>
	</div>
</div>

<a
	href="{% url 'classroom_list' %}"
	class="btn btn-outline-primary"
	role="button"
>
	My Classrooms
</a>

{% if messages %}
<div class="mt-3">
	{% for message in messages %}
	<div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
	{% endfor %}
</div>
{% endif %}

<section class="mt-4">
	<div class="container">
		<div class="row">
			<div class="col-md-6 mx-auto">
				<div class="card">
					<div class="card-header text-black"></div>
					<div class="card-body">
						<form method="post">
							{% csrf_token %} {{ form|crispy }}
							<input type="submit" value="Submit" class="btn btn-primary" />
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

{% endblock %}
